apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
spec:
  template:
    spec:
      serviceAccountName: default
      containers:
      - name: epp
        image: epp-scheduler:local
        imagePullPolicy: Never
        args:
        - --endpoint-selector
        - "app=vllm-qwen3-32b"  # 👈 Hooks directly onto your 4 active pods!
        - --endpoint-target-ports
        - "8000"
        - --v
        - "4"
        - --zap-encoder
        - "json"
        - --grpc-port
        - "9002"
        - --grpc-health-port
        - "9003"
        - --config-file
        - "/etc/epp/epp-config.yaml"
        - --metrics-endpoint-auth=false
        livenessProbe: $patch: delete
        readinessProbe: $patch: delete
      - name: vllm-render
        image: vllm-render:local
        imagePullPolicy: IfNotPresent
        args: ["Qwen/Qwen2.5-32B-Instruct", "--port=8000"]