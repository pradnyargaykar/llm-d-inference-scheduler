apiVersion: inference.networking.x-k8s.io/v1alpha1
kind: EndpointPickerConfig
plugins:
- type: tokenizer
  parameters:
    url: "http://localhost:8000"
- type: program-aware-fairness
# Old queue-based scorer (commented out)
# - type: queue-scorer
# New program-aware budget-based scorer with utilization-based refresh
- type: program-aware-scorer
  name: program-aware-scorer
  parameters:
    defaultBudget: 100               # Initial budget per program per pod (also max budget)
    refreshAmount: 10                 # Base amount to add per refresh cycle
    refreshInterval: "30s"            # Budget refresh interval
    lowUtilThreshold: 0.3             # Low utilization threshold (< 30%)
    mediumUtilThreshold: 0.7          # Medium utilization threshold (30-70%)
    lowUtilMultiplier: 1.5            # Multiplier for low-util pods (150 requests)
    mediumUtilMultiplier: 1.0         # Multiplier for medium-util pods (100 requests)
    highUtilMultiplier: 0.5           # Multiplier for high-util pods (50 requests)
- type: max-score-picker
- type: single-profile-handler

featureGates:
- flowControl

flowControl:
  defaultPriorityBand:
    fairnessPolicyRef: program-aware-fairness

schedulingProfiles:
- name: default
  plugins:
  # - pluginRef: queue-scorer  # Old scorer (commented out)
  - pluginRef: program-aware-scorer  # New budget-based scorer
  - pluginRef: max-score-picker
